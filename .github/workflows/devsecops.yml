name: DevSecOps Pipeline

# Flow: build-test -> [secret-scan, sast, dependency-scan, sonarcloud] (parallel) -> dast -> docker
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: vuln-bank
  # Quality gate mode. Repo variable GATE_ENFORCE (Settings > Secrets and variables > Actions > Variables):
  #   unset / "false" -> scans report only (use for the baseline run)
  #   "true"          -> critical/high findings FAIL the pipeline (the real gate)

jobs:
  # ---------------------------------------------------------------- 1. Build & test
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Unit tests (if present)
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest
            python -m pytest -q
          else
            echo "No tests found, skipping"
          fi

  # ---------------------------------------------------------------- 2. Secret scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --redact --exit-code 1 \
            --report-format json --report-path /repo/gitleaks-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 3. SAST
  sast:
    name: SAST (Bandit + Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit semgrep

      - name: Bandit (fail on HIGH severity)
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        run: bandit -r . -x ./.venv,./venv,./tests -f json -o bandit-report.json --severity-level high

      - name: Semgrep (fail on ERROR severity)
        if: always()
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        run: |
          semgrep scan --config p/security-audit --config p/python \
            --severity ERROR --error --json --output semgrep-report.json \
            --exclude-rule python.flask.security.injection.tainted-sql-string.tainted-sql-string .

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 4. SCA
  dependency-scan:
    name: Dependency Scan (Trivy)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (CRITICAL, HIGH)
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        run: |
          # readable table in the log (never fails)
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0
          # JSON report + gate (fails on CRITICAL/HIGH)
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --format json --output /src/trivy-fs-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 5. SonarCloud
  sonarcloud:
    name: SonarCloud Scan
    needs: build-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
  # ---------------------------------------------------------------- 6. DAST
  dast:
    name: DAST (OWASP ZAP)
    needs: [secret-scan, sast, dependency-scan, sonarcloud]
    if: ${{ !cancelled() && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the app with docker compose (staging)
        run: |
          docker compose up -d --build web db
          for i in $(seq 1 40); do
            curl -sf http://localhost:5000/healthz >/dev/null && echo "App is up" && exit 0
            sleep 3
          done
          echo "App did not start"; docker compose logs web; exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: ${{ vars.GATE_ENFORCE == 'true' }}
          artifact_name: zap-report

      - name: Stop staging
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- 7. Docker
  docker:
    name: Docker Build, Scan and Push
    needs: dast
    if: ${{ !cancelled() && needs.dast.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Trivy image scan (CRITICAL, HIGH)
        continue-on-error: ${{ vars.GATE_ENFORCE != 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 ${{ env.IMAGE_NAME }}:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --format json --output /out/trivy-image-report.json ${{ env.IMAGE_NAME }}:ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: ignore

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKER_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
